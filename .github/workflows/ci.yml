name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update -q
          sudo apt-get install -y llvm-19-dev libpolly-19-dev

      - name: Set LLVM paths
        run: |
          echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Clone and build simulator tools
        run: |
          git clone --depth 1 https://github.com/perplexinglysimple/LwirSimulator.git ../LwirSimulator
          cargo build --manifest-path ../LwirSimulator/Cargo.toml --bin vliw_verify --bin vliw_simulator
          SIM_DIR="$(realpath ../LwirSimulator)"
          echo "VLIW_VERIFY_BIN=${SIM_DIR}/target/debug/vliw_verify" >> "$GITHUB_ENV"
          echo "VLIW_SIMULATOR_BIN=${SIM_DIR}/target/debug/vliw_simulator" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace -- --nocapture
